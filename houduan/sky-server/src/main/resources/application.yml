server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    database: ${sky.redis.database}
mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 未配置环境变量时每次启动生成临时密钥，正式部署必须提供稳定的高强度密钥
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:${random.uuid}}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET:${random.uuid}}
    user-ttl: 7200000
    user-token-name: authentication
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  shop:
    id: 1
    name: ${SHOP_NAME:餐云智慧餐饮}
    phone: ${SHOP_PHONE:}
    delivery-fee: 6.00
    pack-fee-per-item: 1.00
    estimated-delivery-minutes: 30
    max-delivery-distance-meters: 5000
